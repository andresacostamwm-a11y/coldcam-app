<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@hyperframes/shader-transitions/dist/index.global.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- FILL: Google Fonts link -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* === FILL: Your brand identity === */
        --bg: #0a0a0d;
        --ink: #f5f5f7;
        --accent: #7c6cff;
        --muted: #5a6270;
        --accent-dim: #3d3680;
        --font-display: "Space Grotesk", sans-serif;
        --font-data: "JetBrains Mono", monospace;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      .scene {
        position: absolute;
        top: 0;
        left: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      .scene-content {
        width: 100%;
        height: 100%;
        padding: 100px 160px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 24px;
        box-sizing: border-box;
        position: relative;
        z-index: 1;
      }
      .clip {
      }

      .display {
        font-family: var(--font-display);
        font-weight: 700;
        line-height: 1.1;
      }
      .body-text {
        font-family: var(--font-display);
        font-weight: 300;
        line-height: 1.4;
        color: var(--muted);
      }
      .data-text {
        font-family: var(--font-data);
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 50;
        opacity: 0.18;
        background-image:
          radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1.2px),
          radial-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1.2px);
        background-size:
          3px 3px,
          5px 5px;
        background-position:
          0 0,
          1px 2px;
        mix-blend-mode: overlay;
      }

      .vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 49;
        background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
      }

      /* === FILL: Per-scene styles below === */
    </style>
  </head>
  <body>
    <!-- Skeleton D -- Cinematic Title (1920x1080, 60s, 7 scenes) -->
    <!-- Scene rhythm: 8-7-8-10-9-10-8. Long holds are intentional (cinematic push) — the 5s ceiling is waived here. Restrained shaders only. -->
    <div
      id="main"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="60"
    >
      <!-- SCENE 1 -- visible from t=0 -->
      <div
        class="scene clip"
        id="s1"
        data-start="0"
        data-duration="8"
        data-track-index="0"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 1 content -->
        </div>
      </div>

      <!-- SCENE 2 -- hard cut, runtime-managed -->
      <div
        class="scene clip"
        id="s2"
        data-start="8"
        data-duration="7"
        data-track-index="0" style="visibility:hidden;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 2 content -->
        </div>
      </div>

      <!-- SCENE 3 -- SHADER ANCHOR (opacity:0, HyperShader manages) -->
      <div
        class="scene clip"
        id="s3"
        data-start="15"
        data-duration="8"
        data-track-index="0" style="opacity:0;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 3 content -->
        </div>
      </div>

      <!-- SCENE 4 -- SHADER ANCHOR (opacity:0, HyperShader manages) -->
      <div
        class="scene clip"
        id="s4"
        data-start="23"
        data-duration="10"
        data-track-index="0" style="opacity:0;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 4 content -->
        </div>
      </div>

      <!-- SCENE 5 -- hard cut, runtime-managed -->
      <div
        class="scene clip"
        id="s5"
        data-start="33"
        data-duration="9"
        data-track-index="0" style="visibility:hidden;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 5 content -->
        </div>
      </div>

      <!-- SCENE 6 -- SHADER ANCHOR (opacity:0, HyperShader manages) -->
      <div
        class="scene clip"
        id="s6"
        data-start="42"
        data-duration="10"
        data-track-index="0" style="opacity:0;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 6 content -->
        </div>
      </div>

      <!-- SCENE 7 -- SHADER ANCHOR (opacity:0, HyperShader manages) -->
      <div
        class="scene clip"
        id="s7"
        data-start="52"
        data-duration="8"
        data-track-index="0" style="opacity:0;"
      >
        <div class="grain"></div>
        <div class="vignette"></div>
        <div class="scene-content">
          <!-- FILL: Scene 7 content -->
        </div>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      // --- Non-anchor scene visibility toggles (REQUIRED — autoAlpha, not visibility) ---
      tl.set("#s1", { autoAlpha: 0 }, 8);
      tl.set("#s2", { autoAlpha: 1 }, 8);
      tl.set("#s2", { autoAlpha: 0 }, 15);
      tl.set("#s3", { opacity: 1 }, 15); // first anchor of a shader group must be shown explicitly
      // FIX (not in the upstream guide): a trailing shader anchor followed by a hard cut to a
      // non-anchor scene is never hidden by HyperShader, so both scenes render stacked.
      // Verified by render + frame extraction. Hide the trailing anchor at its end time.
      tl.set("#s4", { autoAlpha: 0 }, 33);
      tl.set("#s5", { autoAlpha: 1 }, 33);
      tl.set("#s5", { autoAlpha: 0 }, 42);
      tl.set("#s6", { opacity: 1 }, 42); // first anchor of a shader group must be shown explicitly

      // === SCENE 1 (0-8s) — hard cut ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 2 (8-15s) — hard cut ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 3 (15-23s) — SHADER ANCHOR, no exit tweens ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 4 (23-33s) — SHADER ANCHOR, no exit tweens ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 5 (33-42s) — hard cut ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 6 (42-52s) — SHADER ANCHOR, no exit tweens ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // === SCENE 7 (52-60s) — SHADER ANCHOR, no exit tweens, final scene — exit OK ===
      // FILL: entrance tweens + 2+ mid-scene patterns from Section 8

      // --- Shader transitions (3 key moments; every other cut is a hard cut) ---
      window.HyperShader.init({
        bgColor:
          getComputedStyle(document.documentElement).getPropertyValue("--bg").trim() || "#0a0a0d",
        scenes: ["s3", "s4", "s6", "s7"],
        timeline: tl,
        transitions: [
          { time: 22.75, shader: "cross-warp-morph", duration: 0.6 },
          { time: 32.75, shader: "thermal-distortion", duration: 0.6 },
          { time: 51.75, shader: "cross-warp-morph", duration: 0.6 }
        ],
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
